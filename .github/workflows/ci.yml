name: bootstrap
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: aegis_test
          POSTGRES_DB: aegis_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aegis_test -d aegis_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: dotnet test apps/api/Aegis.slnx
      - run: pip install -e './apps/ai-runtime[test]'
      - name: Provision public embedding model before offline tests
        run: python -c "import os; from fastembed import TextEmbedding; from app.rag.knowledge import MODEL; TextEmbedding(model_name=MODEL, cache_dir=os.environ['EMBEDDING_CACHE_DIR'])"
        env:
          EMBEDDING_CACHE_DIR: ${{ github.workspace }}/.model-cache
          HF_HUB_DISABLE_TELEMETRY: '1'
      - run: python -m pytest apps/ai-runtime/tests -q
        env:
          AEGIS_TEST_DATABASE_URL: postgresql://aegis_test@localhost:5432/aegis_test
          AEGIS_REAL_EMBEDDINGS: '1'
          EMBEDDING_CACHE_DIR: ${{ github.workspace }}/.model-cache
          HF_HUB_OFFLINE: '1'
          HF_HUB_DISABLE_TELEMETRY: '1'
      - run: npm ci
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
      - run: npm test -- --watch=false --browsers=ChromeHeadless
        working-directory: apps/web
      - run: docker compose config --quiet
        env:
          POSTGRES_PASSWORD: ci-ephemeral-validation-only
