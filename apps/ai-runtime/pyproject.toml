[build-system]
requires = ["setuptools>=75,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-ai-runtime"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = ["fastapi==0.121.0", "uvicorn==0.38.0", "fastembed==0.9.1", "psycopg[binary]==3.3.8", "pypdf==6.2.0", "mcp==1.30.0"]

[project.optional-dependencies]
test = ["pytest==8.4.2", "httpx==0.28.1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
